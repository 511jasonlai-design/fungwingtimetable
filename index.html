        const days = ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"];

        function filterSchedule() {
            const selectedBranch = document.getElementById("branch").value;
            const selectedGrade = document.getElementById("grade").value;
            const selectedSubject = document.getElementById("subject").value;

            // 篩選符合條件的課程
            const filtered = scheduleData.filter(item => {
                return (item.branch === selectedBranch) &&
                       (selectedGrade === "ALL" || item.grade === selectedGrade) &&
                       (selectedSubject === "ALL" || item.subject === selectedSubject);
            });

            // 獲取所有出現的時間段並排序
            const timeSlots = [...new Set(filtered.map(item => item.time))].sort();

            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (timeSlots.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="no-data">沒有找到符合條件的班別時間</td></tr>`;
                return;
            }

            // 建立時間表表格
            timeSlots.forEach(time => {
                const tr = document.createElement("tr");
                
                // 時間欄位
                const timeTd = document.createElement("td");
                timeTd.innerHTML = `<strong>${time}</strong>`;
                tr.appendChild(timeTd);

                // 星期一至星期日欄位
                days.forEach(day => {
                    const td = document.createElement("td");
                    const matches = filtered.filter(item => item.time === time && item.day === day);
                    
                    matches.forEach(match => {
                        const classDiv = document.createElement("div");
                        classDiv.className = "class-card";
                        classDiv.innerHTML = `<strong>[${match.grade}] ${match.subject}</strong><br>${match.teacher}`;
                        td.appendChild(classDiv);
                    });

                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        // 初始化載入
        window.onload = filterSchedule;
    </script>
