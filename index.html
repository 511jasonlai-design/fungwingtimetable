<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "YuGothic", "微軟正黑體", sans-serif;
    background-color: #fdfbf7;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  table {
    border-collapse: separate;
    border-spacing: 8px;
    width: 90%;
    max-width: 800px;
  }
  th, td {
    border-radius: 12px;
    text-align: center;
    padding: 12px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
  }
  th {
    background-color: #e2d4f0;
    color: #4a3e56;
    font-size: 20px;
    font-weight: bold;
  }
  /* 左邊時間欄：字體加大、可愛深紫灰配色 */
  .time-col {
    background-color: #eee5f8;
    color: #5d4a6d;
    font-size: 20px;
    font-weight: bold;
    width: 15%;
  }
  /* 中間格子文字：加大加粗 */
  .cell-text {
    font-size: 22px;
    font-weight: bold;
    display: block;
  }
  /* 科目專屬顏色 */
  .chinese {
    background-color: #ffb7c5; /* 櫻花粉 */
    color: #5c1d28;
  }
  .english {
    background-color: #a8e6cf; /* 薄荷綠 */
    color: #1b4d3e;
  }
  .math {
    background-color: #ffd3b6; /* 奶油黃/暖杏色 */
    color: #5a3d28;
  }
  .other {
    background-color: #f0f0f0;
    color: #666666;
  }
</style>
</head>
<body>

<table>
  <tr>
    <th>時間</th>
    <th>週一</th>
    <th>週二</th>
    <th>週三</th>
    <th>週四</th>
    <th>週五</th>
  </tr>
  <tr>
    <td class="time-col">08:00<br>|<br>09:00</td>
    <td class="chinese"><span class="cell-text">中文</span></td>
    <td class="english"><span class="cell-text">英文</span></td>
    <td class="math"><span class="cell-text">數學</span></td>
    <td class="chinese"><span class="cell-text">中文</span></td>
    <td class="english"><span class="cell-text">英文</span></td>
  </tr>
  <tr>
    <td class="time-col">09:10<br>|<br>10:10</td>
    <td class="math"><span class="cell-text">數學</span></td>
    <td class="chinese"><span class="cell-text">中文</span></td>
    <td class="english"><span class="cell-text">英文</span></td>
    <td class="math"><span class="cell-text">數學</span></td>
    <td class="chinese"><span class="cell-text">中文</span></td>
  </tr>
</table>

</body>
</html>
